<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ipw-boce · 拨测控制台</title>
    <script>
      // 首屏主题：必须在样式生效前打上 data-theme，否则默认亮色会被暗色基线闪一下。
      // 与 src/composables/useTheme.js 共用 boce-theme 这个 storage key。
      (function () {
        try {
          var saved = localStorage.getItem('boce-theme')
          document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
